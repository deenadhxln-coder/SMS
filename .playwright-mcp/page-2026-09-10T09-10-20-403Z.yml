      - generic [ref=e449]:
        - generic [ref=e450]:
          - generic [ref=e451]: SECURITY & ISOLATION ARCHITECTURE
          - heading "Built for a multi-tenant world." [level=2] [ref=e456]
          - paragraph [ref=e457]: DHXLN is architected from the ground up around strict tenant isolation, zero client trust, verified authentication contexts, and complete administrative accountability.
        - generic [ref=e458]:
          - generic [ref=e459]:
            - heading "Cryptographic JWT Context" [level=3] [ref=e464]
            - paragraph [ref=e465]: Tenant identification is strictly validated from signed JWT claims. Client-supplied headers, request bodies, or URL parameters are never trusted for tenant scoping.
          - generic [ref=e466]:
            - heading "Parameterized Query Isolation" [level=3] [ref=e472]
            - paragraph [ref=e473]: All tenant queries are explicitly parameterized and scoped by tenant ID, preventing data leakage and ensuring complete cross-school isolation at the database layer.
          - generic [ref=e474]:
            - heading "Role-Based Access Governance" [level=3] [ref=e480]
            - paragraph [ref=e481]: Multi-tiered authorization segregates Platform Super Administrators from School Administrators, Teachers, Students, and Parents with dedicated middleware guards.
          - generic [ref=e482]:
            - heading "Tenant-Scoped Socket Channels" [level=3] [ref=e490]
            - paragraph [ref=e491]: Real-time WebSocket events and announcements are isolated to verified tenant-specific socket rooms, ensuring zero cross-tenant event bleed.
          - generic [ref=e492]:
            - heading "Isolated Cache Namespaces" [level=3] [ref=e497]
            - paragraph [ref=e498]: In-memory Redis cache keys and session states are prefixed by verified tenant identifiers to ensure strict isolation across cached operations.
          - generic [ref=e499]:
            - heading "Searchable Platform Auditability" [level=3] [ref=e504]
            - paragraph [ref=e505]: Every administrative mutation, onboarding action, and plan migration is recorded with timestamped metadata for complete operational traceability.
