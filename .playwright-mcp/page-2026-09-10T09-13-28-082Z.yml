      - generic [ref=f4e449]:
        - generic [ref=f4e450]:
          - generic [ref=f4e451]: SECURITY & ISOLATION ARCHITECTURE
          - heading "Built for a multi-tenant world." [level=2] [ref=f4e456]
          - paragraph [ref=f4e457]: DHXLN is architected from the ground up around strict tenant isolation, zero client trust, verified authentication contexts, and complete administrative accountability.
        - generic [ref=f4e458]:
          - generic [ref=f4e459]:
            - heading "Cryptographic JWT Context" [level=3] [ref=f4e464]
            - paragraph [ref=f4e465]: Tenant identification is strictly validated from signed JWT claims. Client-supplied headers, request bodies, or URL parameters are never trusted for tenant scoping.
          - generic [ref=f4e466]:
            - heading "Parameterized Query Isolation" [level=3] [ref=f4e472]
            - paragraph [ref=f4e473]: All tenant queries are explicitly parameterized and scoped by tenant ID, preventing data leakage and ensuring complete cross-school isolation at the database layer.
          - generic [ref=f4e474]:
            - heading "Role-Based Access Governance" [level=3] [ref=f4e480]
            - paragraph [ref=f4e481]: Multi-tiered authorization segregates Platform Super Administrators from School Administrators, Teachers, Students, and Parents with dedicated middleware guards.
          - generic [ref=f4e482]:
            - heading "Tenant-Scoped Socket Channels" [level=3] [ref=f4e490]
            - paragraph [ref=f4e491]: Real-time WebSocket events and announcements are isolated to verified tenant-specific socket rooms, ensuring zero cross-tenant event bleed.
          - generic [ref=f4e492]:
            - heading "Isolated Cache Namespaces" [level=3] [ref=f4e497]
            - paragraph [ref=f4e498]: In-memory Redis cache keys and session states are prefixed by verified tenant identifiers to ensure strict isolation across cached operations.
          - generic [ref=f4e499]:
            - heading "Searchable Platform Auditability" [level=3] [ref=f4e504]
            - paragraph [ref=f4e505]: Every administrative mutation, onboarding action, and plan migration is recorded with timestamped metadata for complete operational traceability.
